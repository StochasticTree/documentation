on:
  pull_request:
    branches: [main]
  release:
    types: [published]
  workflow_dispatch:
  schedule:
    - cron: '0 0 * * *' # Run daily at midnight UTC

name: docs

# Serialize everything that writes to gh-pages so the per-version deploys
# never race each other. PRs (build-only, no deploy) get a unique group so
# they are never queued behind a deploy.
concurrency:
  group: docs-gh-pages-${{ github.event_name == 'pull_request' && github.run_id || 'deploy' }}
  cancel-in-progress: false

jobs:
  # Decide which versions to build. versions.json on the DEFAULT branch (main)
  # is the single source of truth. On a PR we only smoke-build "latest".
  setup:
    runs-on: ubuntu-latest
    outputs:
      matrix: ${{ steps.set.outputs.matrix }}
    steps:
      - name: Checkout documentation repo
        uses: actions/checkout@v4

      - name: Select version matrix
        id: set
        run: |
          if [ "${{ github.event_name }}" = "pull_request" ]; then
            echo "matrix=$(jq -c '[.[] | select(.name=="latest")]' versions.json)" >> "$GITHUB_OUTPUT"
          else
            echo "matrix=$(jq -c '.' versions.json)" >> "$GITHUB_OUTPUT"
          fi

  docs:
    needs: setup
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      # Serialize matrix jobs: each deploys to the same gh-pages branch.
      max-parallel: 1
      matrix:
        include: ${{ fromJSON(needs.setup.outputs.matrix) }}
    env:
      GITHUB_PAT: ${{ secrets.GITHUB_TOKEN }}
    permissions:
      contents: write
    steps:
      # Documentation repo: the "latest" build uses the triggering ref (blank);
      # each version pins its own docs branch (e.g. rc-0.5.0), which carries the
      # version-specific .qmd/.md content and nav.
      - name: Checkout documentation repo (${{ matrix.name }})
        uses: actions/checkout@v4
        with:
          ref: ${{ matrix.docs_ref }}

      # R package source (pkgdown + R vignette install). Blank ref = default branch.
      - name: Checkout stochtree R source (${{ matrix.r_ref || 'default' }})
        uses: actions/checkout@v4
        with:
          repository: 'StochasticTree/stochtree'
          ref: ${{ matrix.r_ref }}
          path: 'stochtree_repo'
          submodules: 'recursive'

      # Python package source (pip install + quartodoc). Blank ref = default branch.
      - name: Checkout stochtree Python source (${{ matrix.py_ref || 'default' }})
        uses: actions/checkout@v4
        with:
          repository: 'StochasticTree/stochtree'
          ref: ${{ matrix.py_ref }}
          path: 'stochtree_repo_py'
          submodules: 'recursive'

      # C++ core source for Doxygen. Only some versions ship the C++ core +
      # Doxyfile (e.g. the monorepo default branch); single-language packaged
      # branches (r-rc-*, py-rc-*) do not, so this is gated on `build_cpp` and
      # uses its own ref.
      - name: Checkout stochtree C++ source (${{ matrix.cpp_ref || 'default' }})
        if: ${{ matrix.build_cpp }}
        uses: actions/checkout@v4
        with:
          repository: 'StochasticTree/stochtree'
          ref: ${{ matrix.cpp_ref }}
          path: 'stochtree_repo_cpp'
          submodules: 'recursive'

      - name: Install doxygen and graphviz
        if: ${{ matrix.build_cpp }}
        run: |
          sudo apt-get install doxygen graphviz -y

      - name: Build the C++ doxygen output
        if: ${{ matrix.build_cpp }}
        run: |
          sed -i 's|^OUTPUT_DIRECTORY *=.*|OUTPUT_DIRECTORY = ../docs/cpp_docs/|' stochtree_repo_cpp/Doxyfile
          sed -i 's|^GENERATE_XML *=.*|GENERATE_XML = NO|' stochtree_repo_cpp/Doxyfile
          sed -i 's|^GENERATE_HTML *=.*|GENERATE_HTML = YES|' stochtree_repo_cpp/Doxyfile
          mkdir -p docs/cpp_docs/
          cd stochtree_repo_cpp
          doxygen Doxyfile
          cd ..

      - name: Setup Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: "pip"

      - name: Install python dependencies for the doc site and stochtree python package
        run: |
          pip install --upgrade pip
          pip install -r requirements.txt

      - name: Install local copy of the stochtree python package
        run: |
          cd stochtree_repo_py
          pip install .
          cd ..

      - name: Set RETICULATE_PYTHON for vignette rendering
        run: echo "RETICULATE_PYTHON=$(which python)" >> $GITHUB_ENV

      - name: Setup pandoc
        uses: r-lib/actions/setup-pandoc@v2

      - name: Setup R
        uses: r-lib/actions/setup-r@v2
        with:
          use-public-rspm: true

      - name: Install R dependencies
        uses: r-lib/actions/setup-r-dependencies@v2
        with:
          working-directory: 'stochtree_repo'
          extra-packages: any::latex2exp, any::ggplot2, any::decor, any::pkgdown, any::reticulate, any::bayesplot, any::coda, any::doParallel, any::foreach, any::mvtnorm, any::rpart, any::rpart.plot, any::tgp, any::rprojroot
          needs: website

      # The monorepo default branch assembles a CRAN-friendly package into
      # stochtree_cran; pre-packaged branches (r-rc-*) already are that package,
      # so they skip the bootstrap and point r_pkg_path at the checkout root.
      - name: Assemble CRAN-friendly R package
        if: ${{ matrix.r_bootstrap }}
        run: |
          cd stochtree_repo
          Rscript cran-bootstrap.R 0 1 0
          cd ..

      - name: Build R doc site
        run: |
          mkdir -p docs/R_docs/pkgdown
          Rscript -e 'pkgdown::build_site_github_pages("${{ matrix.r_pkg_path }}", dest_dir = file.path(getwd(), "docs/R_docs/pkgdown"), install = TRUE)'

      - name: Install stochtree R package for vignettes
        run: Rscript -e 'install.packages("${{ matrix.r_pkg_path }}", repos = NULL, type = "source")'

      - name: Clean up the temporary stochtree_cran directory created
        if: ${{ matrix.r_bootstrap }}
        run: |
          cd stochtree_repo
          Rscript cran-cleanup.R
          cd ..

      - name: Install Quarto
        uses: quarto-dev/quarto-actions/setup@v2

      - name: Install quartodoc
        run: pip install quartodoc "griffe<1.0"

      - name: Regenerate Python API reference pages
        run: quartodoc build

      - name: Generate CHANGELOG.md from stochtree NEWS.md
        run: bash generate_changelog.sh

      - name: Build the overall doc site
        run: |
          quarto render

      - name: Deploy to GitHub pages 🚀 (${{ matrix.name }})
        if: github.event_name != 'pull_request'
        uses: JamesIves/github-pages-deploy-action@v4
        with:
          branch: gh-pages
          folder: _site
          # Empty for "latest" (root); "v/rc-0.5.0" etc. for versioned builds.
          target-folder: ${{ matrix.target }}
          # A root deploy must not wipe the versioned sub-sites; a versioned
          # deploy already scopes its clean to its own target folder.
          clean-exclude: |
            v/**
